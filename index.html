<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#D9731F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Бес минут">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<title>Бес минут</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@400;600;700&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: technical study notebook — cool paper, hairline rules, one cobalt accent, mono labels; one column (max 560px), bottom tab bar, full-screen reader */
:root{
  --bg:#F1F2EE; --surface:#FBFBF8; --sunk:#E8EAE4; --ink:#252B2A; --muted:#6B7370; --line:#E1E3DD; --grid:rgba(37,43,42,.04);
  --accent:#21806F; --on-accent:#FFFFFF; --accent-soft:#DDEEE8; --good:#21806F; --bad:#C8463A; --warn-soft:#FDF1DC; --warn:#94600A;
  --shadow:0 1px 2px rgba(37,43,42,.05),0 6px 20px -12px rgba(37,43,42,.16);
  --h0b:#DCF1EC;--h0f:#0F6B5D;--h1b:#FCEBD5;--h1f:#94600A;--h2b:#FBE2E4;--h2f:#A83A4A;--h3b:#DDEBFB;--h3f:#2D5E9E;--h4b:#EBE4FA;--h4f:#5B47A3;--h5b:#E6F2D9;--h5f:#4A7322;
  --f-display:'Geologica',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:10px; --r-s:6px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1F2326; --surface:#282D31; --sunk:#31373C; --ink:#DADFDC; --muted:#9BA4A1; --line:#383F45; --grid:rgba(218,223,220,.035);
    --accent:#7CC2B2; --on-accent:#14231F; --accent-soft:#2F403C; --good:#7CC2B2; --bad:#E39488; --warn-soft:#3A3426; --warn:#D9B370;
    --shadow:0 1px 2px rgba(0,0,0,.18),0 6px 18px -10px rgba(0,0,0,.4);
    --h0b:#2F403C;--h0f:#8FD1C2;--h1b:#3E3524;--h1f:#E1BE80;--h2b:#41302F;--h2f:#E6A2A6;--h3b:#2C3848;--h3f:#9EBFE6;--h4b:#363145;--h4f:#BBAEE6;--h5b:#323C2A;--h5f:#AECB8E;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#1F2326; --surface:#282D31; --sunk:#31373C; --ink:#DADFDC; --muted:#9BA4A1; --line:#383F45; --grid:rgba(218,223,220,.035);
    --accent:#7CC2B2; --on-accent:#14231F; --accent-soft:#2F403C; --good:#7CC2B2; --bad:#E39488; --warn-soft:#3A3426; --warn:#D9B370;
    --shadow:0 1px 2px rgba(0,0,0,.18),0 6px 18px -10px rgba(0,0,0,.4);
    --h0b:#2F403C;--h0f:#8FD1C2;--h1b:#3E3524;--h1f:#E1BE80;--h2b:#41302F;--h2f:#E6A2A6;--h3b:#2C3848;--h3f:#9EBFE6;--h4b:#363145;--h4f:#BBAEE6;--h5b:#323C2A;--h5f:#AECB8E;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
html.locked body{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

#app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(92px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:22px}

.label,.eyebrow{margin:0;font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.top{display:flex;flex-direction:column;gap:6px;padding-top:6px}
h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.005em}
.hint{margin:0;color:var(--muted);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* hero timer */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.hero-time{font-family:var(--f-mono);font-weight:700;font-size:68px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ruler{height:22px;position:relative;background:repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 10%) ,repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 2%);background-size:100% 100%,100% 45%;background-repeat:no-repeat;background-position:0 0,0 100%;border-bottom:1px solid var(--line)}
.ruler::after{content:"";position:absolute;left:0;bottom:-1px;height:3px;width:calc(var(--p,0)*100%);background:var(--accent)}
.hero-meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.toggle{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.toggle button{border:0;background:transparent;padding:5px 10px;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.toggle button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}

.stats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.stats div{padding:12px 0;display:flex;flex-direction:column;gap:2px}
.stats div+div{border-left:1px solid var(--line);padding-left:12px}
.stats b{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--muted)}

.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;align-items:end}
.wk{display:flex;flex-direction:column;align-items:center;gap:6px}
.wk-track{height:56px;width:100%;max-width:22px;background:var(--sunk);border-radius:3px;display:flex;align-items:flex-end;overflow:hidden}
.wk-fill{width:100%;background:var(--ink);opacity:.75}
.wk.today .wk-fill{background:var(--accent);opacity:1}
.wk small{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.wk.today small{color:var(--accent)}
.section{display:flex;flex-direction:column;gap:10px}
.section-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.section-h span{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

/* chips & buttons */
.chip{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:6px 12px;font-size:14px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips .chip{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-s);padding:10px 16px;font-weight:500;color:var(--ink)}
.btn.primary,.btn.sand{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn.ink{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ghost{background:transparent}
.btn.wide{width:100%;padding:14px}
.btn.big{padding:16px 28px;font-size:18px}
.btn:disabled{opacity:.4;cursor:default}
.link{background:none;border:0;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link.danger{color:var(--bad)}
.back{background:none;border:0;padding:0;color:var(--muted);font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;align-self:flex-start}

/* forms */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-s);padding:10px 12px;font-size:16px;color:var(--ink)}
textarea{resize:vertical;min-height:44px}
input[type=file]{padding:8px;font-size:14px}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}
.msg{font-size:13px;color:var(--good);min-height:1em;margin:0}
details.paste summary{cursor:pointer;font-size:13px;color:var(--muted)}
details.paste textarea{margin-top:8px}

/* lists */
.box,.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.list{list-style:none;margin:0;padding:0}
.list li{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.list li:last-child{border-bottom:0}
.list .grp{background:var(--sunk);padding:6px 16px;font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.c-f{font-weight:600;overflow-wrap:anywhere}
.c-b{color:var(--muted);font-size:14px;overflow-wrap:anywhere}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--muted)}
.meta .push{margin-left:auto}
.tag{background:var(--sunk);border-radius:4px;padding:1px 7px;color:var(--ink)}
.ex{border:1px dashed var(--muted);border-radius:4px;padding:0 6px}
.lvl{display:inline-flex;gap:2px}
.lvl i{width:6px;height:6px;border-radius:1px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.note-t{overflow-wrap:anywhere}
.empty-row{color:var(--muted);font-size:14px}
.r-row{display:grid;grid-template-columns:1fr 84px auto;gap:8px;align-items:center}
.r-row input{padding:8px 10px}
.r-row .sec{font-family:var(--f-mono);text-align:right}
details.backup{border-top:1px solid var(--line);padding-top:12px}
details.backup summary{cursor:pointer;font-family:var(--f-mono);font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
details.backup .inner{display:flex;flex-direction:column;gap:10px;padding-top:12px}
details.backup textarea{font-family:var(--f-mono);font-size:12px;min-height:80px}

/* progress */
.mini{height:3px;background:var(--sunk);border-radius:2px;overflow:hidden}
.mini i{display:block;height:100%;background:var(--accent)}
.segs{display:flex;gap:3px}
.segs i{flex:1;height:4px;border-radius:1px;background:var(--sunk)}
.segs i.on{background:var(--accent)}
.segs i.cur{background:var(--ink)}

/* courses */
.cont{background:var(--ink);color:var(--bg);border:0;border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.cont .label{color:inherit;opacity:.65}
.cont .c-f{font-family:var(--f-display);font-size:19px;font-weight:600;line-height:1.25}
.cont .segs i{background:color-mix(in srgb,var(--bg) 22%,transparent)}
.cont .segs i.on{background:var(--accent)}
.cont .meta{color:inherit;opacity:.75}
.crs{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:12px 16px;text-align:left;width:100%}
.crs:last-child{border-bottom:0}
.crs .mono{width:40px;height:40px;border-radius:var(--r-s);border:1px solid var(--line);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:13px}
.crs .txt{display:flex;flex-direction:column;gap:6px;min-width:0}
.crs .pct,.lec .pct{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.lec{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;background:transparent;border:0;border-bottom:1px solid var(--line);padding:14px 16px;text-align:left;width:100%}
.lec:last-child{border-bottom:0}
.lec .segs,.lec .mini{grid-column:1/-1}
.kind{font-family:var(--f-mono);font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:0 5px}
.ok{color:var(--good);font-family:var(--f-mono);font-size:12px}

/* tab bar */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#tabs .in{display:grid;grid-template-columns:repeat(4,1fr);width:100%;max-width:560px}
#tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:var(--muted);font-size:11px}
#tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
#tabs svg{width:22px;height:22px}

/* overlay / reader */
#overlay{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto}
.ov-in{max-width:620px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:calc(12px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.ov-head{display:flex;align-items:center;gap:12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.ov-head .eyebrow{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-family:var(--f-mono);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.bar{height:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--r-s);overflow:hidden}
.seg.s4{grid-template-columns:repeat(4,1fr)}
.seg button{border:0;background:var(--surface);padding:9px 0;font-size:14px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.done-note{margin:0;background:var(--accent-soft);border-radius:var(--r-s);padding:10px 14px;font-size:14px}

.rv{display:flex;flex-direction:column;gap:12px}
.rv-meta{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.card-face{min-height:240px;width:100%;background:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:20px 20px;border:1px solid var(--line);border-radius:var(--r);padding:24px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center}
.card-face .f{font-family:var(--f-display);font-weight:600;font-size:22px;line-height:1.3;overflow-wrap:anywhere}
.card-face .b{font-size:18px;color:var(--accent);overflow-wrap:anywhere;border-top:1px solid var(--line);padding-top:14px;width:100%}
.card-face .tap{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades button{border-radius:var(--r-s);padding:14px 4px;font-weight:600;border:1px solid var(--line);background:var(--surface)}
.grades .g0{color:var(--bad)}
.grades .g2{background:var(--good);border-color:var(--good);color:#fff}
.empty{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding:32px 8px}
.empty p{margin:0;color:var(--muted)}
.empty .big{font-family:var(--f-display);font-weight:700;font-size:26px;color:var(--ink)}
.run{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;padding-top:16px}
.run p{margin:0}
.run-name{font-family:var(--f-display);font-weight:700;font-size:26px;text-wrap:balance}
.run-time{font-family:var(--f-mono);font-weight:700;font-size:88px;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;color:var(--accent)}
.run-next{color:var(--muted)}
.run-ctl{display:flex;gap:10px;margin-top:12px}

.lv{display:flex;flex-direction:column;gap:14px}
.lv-h{display:flex;flex-direction:column;gap:8px}
.lv-h .c-f{font-family:var(--f-display);font-size:20px;line-height:1.25}
.lv-c{overflow-x:auto;display:flex;flex-direction:column;gap:10px;min-height:120px}
.lv-c canvas,.lv-c img{display:block;max-width:none;border-radius:var(--r-s);background:#fff;border:1px solid var(--line)}
.lv-nav{position:sticky;bottom:0;display:grid;grid-template-columns:auto 1fr auto;gap:8px;background:var(--bg);padding-block:10px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}
.lv-nav .btn{padding:12px 14px}

/* lesson prose */
.prose{font-size:17px;line-height:1.65;overflow-wrap:anywhere}
.prose>:first-child{margin-top:0}.prose>:last-child{margin-bottom:0}
.prose h2{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.2;letter-spacing:-.015em;margin:0 0 .6em;text-wrap:balance}
.prose h3{font-family:var(--f-display);font-weight:600;font-size:18px;margin:1.2em 0 .4em}
.prose p{margin:.75em 0}
.prose b{font-weight:600}
.prose ol,.prose ul{padding-left:1.3em}
.prose li{margin:.25em 0}
.prose .lead{font-size:18px;color:var(--muted)}
.prose table{border-collapse:collapse;display:block;overflow-x:auto;font-size:15px;line-height:1.4;margin:1em 0}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:8px 10px 8px 0;text-align:left;vertical-align:top;overflow-wrap:normal;word-break:normal}
.prose th{font-family:var(--f-mono);font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.prose pre{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px;overflow-x:auto;font-family:var(--f-mono);font-size:13px;line-height:1.5;overflow-wrap:normal}
.prose code{font-family:var(--f-mono);font-size:.9em}
.prose figure{margin:1.2em 0;background:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px}
.prose figure img{max-width:100%;max-height:300px;width:auto;height:auto;object-fit:contain;border-radius:var(--r-s);display:block;margin:0 auto;background:#fff}
.prose figcaption{font-family:var(--f-mono);font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);line-height:1.5}
.prose svg{display:block;width:100%;height:auto;max-width:520px;margin:0 auto;color:var(--ink);overflow:visible}
.prose svg text{fill:currentColor;font-family:var(--f-body);font-size:13px}
.prose svg .t-s{font-size:11px}
.prose svg .t-b{font-weight:600}
.prose svg .mu{fill:var(--muted)}
.prose svg .ac{fill:var(--accent)}
.prose svg text.ac{fill:var(--accent)}
.prose svg .on-ac{fill:var(--on-accent)}
.prose svg .soft{fill:var(--accent-soft)}
.prose svg .bx{fill:var(--surface);stroke:currentColor;stroke-width:1.2}
.prose svg .bxa{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
.prose svg .ln{fill:none;stroke:currentColor;stroke-width:1.4}
.prose svg .lna{fill:none;stroke:var(--accent);stroke-width:2}
.prose svg .dash{stroke-dasharray:4 4}
.prose svg .hd{fill:currentColor}
.prose svg .hda{fill:var(--accent)}
.prose aside{margin:1.2em 0;border-radius:var(--r);padding:14px 16px}

const course=id=>S.courses.find(c=>c.id===id);

const lpct=L=>L.done?1:isDoc(L)?Math.min(1,(L.seen||0)/(L.units||1)):Math.min(1,(L.pos||0)/parts(L));
function cpct(c){if(!c.lectures.length)return 0;return c.lectures.reduce((a,L)=>a+lpct(L),0)/c.lectures.length}
const byOrd=(a,b)=>(a.ord??1e9)-(b.ord??1e9)||(a.name||'').localeCompare(b.name||'','kk');
function kids(space,pid){return{fs:S.folders.filter(f=>f.space===space&&f.parent===pid).sort(byOrd),cs:S.courses.filter(c=>c.space===space&&c.folder===pid).sort(byOrd)}}
function mixed(space,pid){const {fs,cs}=kids(space,pid);return [...fs.map(o=>({k:'f:'+o.id,o})),...cs.map(o=>({k:'c:'+o.id,o}))].sort((a,b)=>byOrd(a.o,b.o))}
function nextOrd(space,pid){return mixed(space,pid).reduce((m,x)=>Math.max(m,x.o.ord??-1),-1)+1}
function subFolderIds(fid){const out=[fid];S.folders.filter(f=>f.parent===fid).forEach(f=>out.push(...subFolderIds(f.id)));return out}
function coursesUnder(space,fid){if(fid===null)return S.courses.filter(c=>c.space===space);const ids=subFolderIds(fid);return S.courses.filter(c=>ids.includes(c.folder))}

function textToHtml(t){return t.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean).map(p=>'<p>'+esc(p).replace(/\n/g,'<br>')+'</p>').join('')}
function chunkHtml(html,limit=230){
  const d=document.createElement('div');d.innerHTML=html;const out=[];let cur='',w=0;
  [...d.childNodes].forEach(n=>{const txt=n.textContent||'';const h=n.nodeType===1?n.outerHTML:(txt.trim()?'<p>'+esc(txt)+'</p>':'');if(!h)return;
    const nw=txt.split(/\s+/).filter(Boolean).length+(n.nodeType===1&&n.querySelector('img')?60:0);
    if(w>0&&w+nw>limit){out.push(cur);cur='';w=0}cur+=h;w+=nw});
  if(cur)out.push(cur);return out.length?out:['<p>(бос)</p>'];
}
async function addLecture(){
  const c=course(curCourse);if(!c)return;
  const files=[...($('#lf').files||[])],text=$('#lx').value.trim();let title=$('#lt').value.trim();
  const m=$('#lmsg'),btn=$('#lbtn');

  m.textContent='Өңделуде…';btn.disabled=true;
  try{
    const L={id:uid(),pos:0,page:0,seen:0,done:false,ts:Date.now(),files:[]};
    const f0=files[0],ext=f0?(f0.name.split('.').pop()||'').toLowerCase():'';
    if(!title)title=f0?f0.name.replace(/\.[^.]+$/,''):text.split('\n')[0].slice(0,60);
    if(f0&&ext==='pdf'){
      const lib=await pdfLib();const buf=await f0.arrayBuffer();const doc=await lib.getDocument({data:new Uint8Array(buf)}).promise;
      L.units=doc.numPages;doc.destroy();L.kind='pdf';L.per=2;const k=uid();await idb.set(k,f0);L.files=[k];
    }else if(f0&&f0.type.startsWith('image/')){
      L.kind='img';L.per=2;for(const f of files.filter(f=>f.type.startsWith('image/'))){const k=uid();await idb.set(k,f);L.files.push(k)}L.units=L.files.length;
    }else if(f0&&ext==='docx'){
      await loadScript(MAMMOTH);const r=await window.mammoth.convertToHtml({arrayBuffer:await f0.arrayBuffer()});
      const ch=chunkHtml(r.value);L.kind='docx';L.per=1;L.units=ch.length;const k=uid();await idb.set(k,ch);L.files=[k];
    }else if(f0&&ext==='doc'){throw new Error('ескі .doc форматы. Word-та .docx немесе PDF етіп сақта')}
    else{
      const t=f0?await f0.text():text;const ch=chunkHtml(textToHtml(t));L.kind='text';L.per=1;L.units=ch.length;const k=uid();await idb.set(k,ch);L.files=[k];
    }

}

function vSpace(space){

/* ---------- lecture viewer ---------- */
function sanitize(h){return String(h).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/<(iframe|object|embed|link|style)[\s\S]*?>/gi,'').replace(/\son[a-z]+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'').replace(/javascript:/gi,'')}

function cardForm(c){return `<form id="lvcf" class="panel"><h2>Карточка · ${esc(c.name)}</h2><label>Сұрақ<input id="lq" required autocomplete="off"></label><label>Жауап<textarea id="la" rows="2" required></textarea></label><div class="row"><button class="btn primary">Сақтау</button><p class="msg" id="lvm"></p></div></form>`}
function saveCardFor(c){const f=$('#lq').value.trim(),b=$('#la').value.trim();if(!f||!b)return;S.cards.push({id:uid(),cid:c.id,f,b,box:0,due:Date.now()+DAY/2});save();$('#lq').value='';$('#la').value='';const m=$('#lvm');if(m)m.textContent='Сақталды';$('#lq').focus()}

function lectureView(el,cid,lid){
  const c=course(cid),L=c&&c.lectures.find(l=>l.id===lid);

/* own files: one continuous scroll, pages render lazily */
function docView(el,c,L){
  let pdf=null,urls=[],alive=true,zoom=false,obs=null,saveT=null;const n=L.units||1;
  const unit=L.kind==='pdf'||L.kind==='img'?'бет':'бөлім';
  el.innerHTML=`<div class="lv"><div class="lv-h"><p class="c-f" style="margin:0">${esc(L.title)}</p><div class="meta"><span id="lvp">${unit} ${Math.min((L.page||0)+1,n)} / ${n}</span>${L.kind==='pdf'||L.kind==='img'?'<button class="link push" data-act="lvzoom" id="lvz">Үлкейту</button>':''}</div><div id="lvsegs">${bar(lpct(L))}</div></div>
    <div id="lvc" class="lv-c doc"></div><div id="lvcard"></div>
    <div class="lv-nav one"><button class="btn" data-act="lvcard">+ Карточка</button></div></div>`;
  const box=el.querySelector('#lvc');
  async function build(){
    if(obs)obs.disconnect();box.innerHTML='<p class="hint">Жүктелуде…</p>';
    try{
      if(L.kind==='pdf'){
        if(!pdf){const lib=await pdfLib();const blob=await idb.get(L.files[0]);if(!blob)throw new Error('файл табылмады');pdf=await lib.getDocument({data:new Uint8Array(await blob.arrayBuffer())}).promise}
        const p1=await pdf.getPage(1),v1=p1.getViewport({scale:1}),ratio=v1.height/v1.width;
        box.innerHTML=Array.from({length:n},(_,i)=>`<div class="pg" data-i="${i}" style="aspect-ratio:${(1/ratio).toFixed(4)};width:${zoom?200:100}%"></div>`).join('');
      }else if(L.kind==='img'){
        box.innerHTML=Array.from({length:n},(_,i)=>`<div class="pg img" data-i="${i}" style="width:${zoom?200:100}%"></div>`).join('');
      }else{
        const ch=await idb.get(L.files[0]);if(!ch)throw new Error('мәтін табылмады');
        box.innerHTML='<div class="prose">'+ch.map((h,i)=>`<section class="pg txt" data-i="${i}">${sanitize(h)}</section>`).join('')+'</div>';enhanceChecks(box);
      }
    }catch(e){box.innerHTML=`<p class="hint">Ашылмады: ${esc(e&&e.message||e)}</p>`;return}
    if(L.kind==='pdf'||L.kind==='img'){
      obs=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting)paint(en.target)}),{root:ov,rootMargin:'800px 0px'});
      box.querySelectorAll('.pg').forEach(p=>obs.observe(p));
    }
    const tgt=box.querySelector(`.pg[data-i="${L.page||0}"]`);if(tgt&&(L.page||0)>0)ov.scrollTop=tgt.offsetTop-60;
  }
  async function paint(pg){
    if(pg.dataset.done)return;pg.dataset.done='1';const i=+pg.dataset.i;
    try{
      if(L.kind==='pdf'){const page=await pdf.getPage(i+1);if(!alive)return;const W=pg.clientWidth||340,dpr=Math.min(2,window.devicePixelRatio||1),v0=page.getViewport({scale:1}),vp=page.getViewport({scale:W/v0.width*dpr});
        const cv=document.createElement('canvas');cv.width=Math.floor(vp.width);cv.height=Math.floor(vp.height);pg.appendChild(cv);await page.render({canvasContext:cv.getContext('2d'),viewport:vp}).promise;pg.style.aspectRatio='auto'}
      else{const b=await idb.get(L.files[i]);if(!alive||!b)return;const u=URL.createObjectURL(b);urls.push(u);const im=new Image();im.src=u;im.alt='';pg.appendChild(im)}
    }catch(e){pg.textContent='Бұл бет ашылмады'}
  }
  function onScroll(){
    const pgs=box.querySelectorAll('.pg');if(!pgs.length)return;const line=ov.scrollTop+ov.clientHeight*0.4;let curI=0;
    pgs.forEach(p=>{if(p.offsetTop<=line)curI=+p.dataset.i});
    const atEnd=ov.scrollTop+ov.clientHeight>=ov.scrollHeight-40;if(atEnd)curI=n-1;
    L.page=curI;L.seen=Math.max(L.seen||0,curI+1);if(L.seen>=n)L.done=true;
    const p=el.querySelector('#lvp');if(p)p.textContent=`${unit} ${curI+1} / ${n}`;const g=el.querySelector('#lvsegs');if(g)g.innerHTML=bar(lpct(L));
    clearTimeout(saveT);saveT=setTimeout(save,400);
  }
  ov.addEventListener('scroll',onScroll,{passive:true});
  LV={zoom(){zoom=!zoom;const z=el.querySelector('#lvz');if(z)z.textContent=zoom?'Кішірейту':'Үлкейту';build()},
    card(){const w=el.querySelector('#lvcard');if(w.innerHTML){w.innerHTML='';return}w.innerHTML=cardForm(c);w.scrollIntoView({block:'nearest'});setTimeout(()=>{const q=$('#lq');q&&q.focus()},30)},
    saveCard(){saveCardFor(c)},reset(){L.page=0;L.seen=0;L.done=false;save();ov.scrollTop=0}};
  build();
  return()=>{alive=false;ov.removeEventListener('scroll',onScroll);if(obs)obs.disconnect();clearTimeout(saveT);save();urls.forEach(u=>URL.revokeObjectURL(u));try{pdf&&pdf.destroy()}catch(e){}LV=null};
}
/* lesson packs: 5-minute parts */
function partView(el,c,L){
  let alive=true;
  el.innerHTML=`<div class="lv">
    <div class="lv-h"><p class="c-f" style="margin:0">${esc(L.title)}</p><div class="meta"><span id="lvp"></span></div><div id="lvsegs">${segs(L)}</div></div>
    <div id="lvc" class="lv-c"></div><div id="lvcard"></div>
    <div class="lv-nav" id="lvnav"><button class="btn" data-act="lvprev" aria-label="Алдыңғы бөлік">←</button><button class="btn" data-act="lvcard">+ Карточка</button><button class="btn primary" data-act="lvnext">Келесі →</button></div></div>`;
  const box=el.querySelector('#lvc');
  function draw(){
    const g=el.querySelector('#lvsegs');if(g)g.innerHTML=segs(L);const p=el.querySelector('#lvp');if(p)p.textContent=L.done?'оқылды':'бөлік '+(L.pos+1)+' / '+parts(L);
    const nav=el.querySelector('#lvnav');
    if(L.pos>=parts(L)){nav.hidden=true;const nx=c.lectures.find(l=>!l.done&&l.id!==L.id);
      box.innerHTML=`<div class="empty"><p class="big">Сабақ оқылды</p><p>${esc(L.title)}</p><div class="row" style="justify-content:center">${nx?`<button class="btn primary" data-act="lvgo" data-v="${nx.id}">Келесі: ${esc(nx.title)}</button>`:''}<button class="btn" data-act="lvreset">Басынан оқу</button></div></div>`;return}
    nav.hidden=false;const ch=L.inline||[];box.innerHTML='<div class="prose">'+sanitize(ch.slice(L.pos*L.per,L.pos*L.per+L.per).join(''))+'</div>';enhanceChecks(box);ov.scrollTop=0;
  }
  LV={next(){L.pos=Math.min(parts(L),L.pos+1);L.done=L.pos>=parts(L);save();el.querySelector('#lvcard').innerHTML='';draw()},
    prev(){if(L.done){L.done=false;L.pos=parts(L)-1}else if(L.pos>0)L.pos--;save();draw()},
    reset(){L.pos=0;L.done=false;save();draw()},
    go(id){if(modeCleanup)modeCleanup();modeCleanup=lectureView(el,c.id,id)},
    card(){const w=el.querySelector('#lvcard');if(w.innerHTML){w.innerHTML='';return}w.innerHTML=cardForm(c);setTimeout(()=>{const q=$('#lq');q&&q.focus()},30)},
    saveCard(){saveCardFor(c)}};
  draw();
  return()=>{alive=false;LV=null};
}

function reviewer(el,list){
  const q=dueOf(list).sort((a,b)=>a.due-b.due);let done=0;
  function show(){
    if(!q.length){el.innerHTML=`<div class="empty"><p class="big">Дайын</p><p>${done?done+' карточка қайталанды.':'Қазір қайталайтын карточка жоқ.'}</p></div>`;return}
    const c=q[0],src=course(c.cid);
    el.innerHTML=`<div class="rv"><p class="rv-meta">${src?esc(src.name)+' · ':''}қалды ${q.length}</p>
      <button class="card-face" id="flip"><span class="f">${esc(c.f)}</span><span class="b" hidden>${esc(c.b)}</span><span class="tap">Жауабын көру үшін бас</span></button>
      <div class="grades" id="gr" hidden><button class="g0" data-g="0">Білмеймін</button><button class="g1" data-g="1">Қиын</button><button class="g2" data-g="2">Білемін</button></div></div>`;
    el.querySelector('#flip').onclick=()=>{el.querySelector('.b').hidden=false;el.querySelector('.tap').hidden=true;el.querySelector('#gr').hidden=false};
    el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{const g=+b.dataset.g;grade(c,g);if(g===0)q.push(q.shift());else{q.shift();done++}show()});
  }
  show();
}
function grade(c,g){const now=Date.now();delete c.ex;
  if(g===0){c.box=0;c.due=now}else if(g===1){c.box=Math.max(1,c.box||0);c.due=sod(now)+DAY}else{c.box=Math.min(INT.length-1,(c.box||0)+1);c.due=sod(now)+DAY*INT[c.box]}save()}
function arm(b,fn){if(b.dataset.arm){fn();return}b.dataset.arm='1';const o=b.textContent;b.textContent='Растау: өшіру';setTimeout(()=>{if(b.isConnected){delete b.dataset.arm;b.textContent=o}},2500)}
function flash(id,t){const m=$(id);if(m){m.textContent=t;clearTimeout(m._t);m._t=setTimeout(()=>{m.textContent=''},3000)}}
function dropLectureFiles(L){(L.files||[]).forEach(k=>idb.del(k))}
function deleteCourse(c){c.lectures.forEach(dropLectureFiles);S.cards=S.cards.filter(k=>k.cid!==c.id);S.courses=S.courses.filter(x=>x.id!==c.id);if(S.last&&S.last.c===c.id)S.last=null}
function curSpace(){return tab==='skills'?'skills':'courses'}

const ACT={
  close:()=>closeOverlay(),
  sclose:()=>closeSheet(),
  tab:(b,v)=>{if(noteOpen)closeNote();tab=v;if(v==='cards')cardsAt={space:null,fid:null};render();window.scrollTo(0,0)},
  open:(b,v)=>{const sp=b.dataset.s||curSpace();tab=sp;cur[sp]=v||null;render();window.scrollTo(0,0)},
  course:(b,v)=>{curCourse=v;tab='course';render();window.scrollTo(0,0)},
  plus:b=>{const sp=curSpace(),T=SPACE[sp];openPop(b,`<button data-act="newf">${ICON.folder} Жаңа папка</button><button data-act="newc">${PLUS} Жаңа ${T.one}</button><hr><button data-act="pkimp">Сабақ пакетін импорттау</button>`)},
  newf:()=>nameSheet('Жаңа папка','',{op:'newf'},'Папка атауы'),
  newc:()=>{const T=SPACE[curSpace()];nameSheet('Жаңа '+T.one,'',{op:'newc'},T.ph)},
  pkimp:()=>{closePop();$('#pk').click()},
  imenu:(b,v)=>openPop(b,itemMenu(v)),
  pin:(b,v)=>{const o=objOf(v);o.pinned=!o.pinned;o.pinAt=Date.now();save();closePop();if(v[0]==='n'&&noteOpen)return;render()},
  ren:(b,v)=>{const o=objOf(v);nameSheet('Атын өзгерту',o.name||o.title,{op:'ren',key:v})},
  mvsheet:(b,v)=>moveSheet(v),
  mvto:(b,v)=>{const k=sheetCtx.key,[t]=k.split(':'),o=objOf(k),to=v||null;if(t==='f')o.parent=to;else o.folder=to;o.ord=nextOrd(o.space,to);closeSheet();save();render();flash('#pmsg','Жылжытылды')},
  rm:(b,v)=>arm(b,()=>{const [t,id]=v.split(':');closePop();
    if(t==='f'){const f=folder(id);S.folders.forEach(x=>{if(x.parent===id)x.parent=f.parent});S.courses.forEach(c=>{if(c.folder===id)c.folder=f.parent});S.folders=S.folders.filter(x=>x.id!==id);if(cur[f.space]===id)cur[f.space]=f.parent;save();render();flash('#pmsg','Папка өшірілді, ішіндегілер бір деңгей жоғары көшті');return}
    if(t==='c'){const c=course(id);const sp=c.space;deleteCourse(c);if(tab==='course'){tab=sp}save();render();return}
    if(t==='l'){const c=course(curCourse);const L=c.lectures.find(l=>l.id===id);if(L)dropLectureFiles(L);c.lectures=c.lectures.filter(l=>l.id!==id);save();render();return}
    if(t==='n'){S.notes=S.notes.filter(n=>n.id!==id);if(noteOpen===id){noteOpen=null;ov.hidden=true;ov.innerHTML='';document.documentElement.classList.remove('locked')}save();render()}}),
  lreset:(b,v)=>{const L=objOf(v);L.pos=0;L.page=0;L.seen=0;L.done=false;save();closePop();render()},
  addmat:()=>materialSheet(),
  emo:(b,v)=>{const o=objOf(v);openSheet('Иконка',`<div class="emo-grid">${EMOJI.map(e=>`<button data-act="emopick" data-v="${e}" class="${o.emoji===e?'on':''}">${e}</button>`).join('')}</div><form id="emoform" class="inline"><input id="emoin" placeholder="Немесе кез келген эмодзи" maxlength="8" autocomplete="off"><button class="btn primary">Қою</button></form><button class="btn ghost wide" data-act="emopick" data-v="">Иконканы алып тастау</button>`,{key:v,noFocus:true})},
  emopick:(b,v)=>{const o=objOf(sheetCtx.key);if(o){if(v)o.emoji=v;else delete o.emoji;save()}closeSheet();render()},
  theme:(b,v)=>{setTheme(v);render()},
  lec:b=>{const c=course(b.dataset.c);if(!c)return;const body=openOverlay(esc(c.name));modeCleanup=lectureView(body,c.id,b.dataset.v)},
  lvnext:()=>LV&&LV.next&&LV.next(), lvprev:()=>LV&&LV.prev&&LV.prev(), lvzoom:()=>LV&&LV.zoom&&LV.zoom(), lvreset:()=>LV&&LV.reset(), lvcard:()=>LV&&LV.card(), lvgo:(b,v)=>LV&&LV.go&&LV.go(v),
  cgo:(b,v)=>{cardsAt=v?{space:b.dataset.s,fid:v}:{space:null,fid:null};render();window.scrollTo(0,0)},
  review:(b,v)=>{const body=openOverlay('Карточкалар');reviewer(body,cardsFor(v))},
  nnew:()=>{const n={id:uid(),t:'',ts:Date.now(),upd:Date.now()};S.notes.unshift(n);openNote(n.id)},
  nopen:(b,v)=>openNote(v),
  nclose:()=>closeNote(),
  copy:()=>{const ta=$('#bx');ta.value=JSON.stringify(S);const sel=()=>{ta.focus();ta.select();flash('#bmsg','Мәтін белгіленді, өзің көшіріп ал')};
    try{navigator.clipboard.writeText(ta.value).then(()=>flash('#bmsg','Көшірілді. Telegram-ға не жазбаға сақтап қой.'),sel)}catch(e){sel()}},
  import:()=>{try{const o=JSON.parse($('#bi').value);if(!o||!Array.isArray(o.courses))throw 0;S=o;norm();save();render();flash('#bmsg','Қалпына келтірілді')}catch(e){flash('#bmsg','Қате: көшірме мәтіні толық емес')}},
  clearex:()=>{S.courses.filter(c=>c.ex).forEach(deleteCourse);S.cards=S.cards.filter(c=>!c.ex);S.notes=S.notes.filter(n=>!n.ex);save();render()}
};

function mergePack(o,space,here,cnt){
      let c=S.courses.find(x=>x.pid===o.course.id);
      if(!c){const sp=o.course.space==='skills'||o.course.space==='courses'?o.course.space:space;c={id:uid(),pid:o.course.id,name:o.course.name||o.course.id,space:sp,folder:sp===space?here:null,lectures:[]};c.ord=nextOrd(sp,c.folder);S.courses.push(c)}
      o.lectures.forEach(x=>{
        const parts=(x.parts||[]).filter(p=>typeof p==='string');if(!parts.length)return;
        let L=c.lectures.find(l=>l.lid===x.id);
        if(L){L.title=x.title||L.title;L.inline=parts;L.units=parts.length;L.order=x.order;if(L.pos>parts.length)L.pos=parts.length}
        else{c.lectures.push({id:uid(),lid:x.id,title:x.title||'Сабақ',kind:'text',per:1,inline:parts,units:parts.length,pos:0,done:false,ts:Date.now(),files:[],order:x.order||999,pack:true});cnt.nl++}
        (x.cards||[]).forEach(k=>{if(k&&k.f&&k.b&&!S.cards.some(q=>q.cid===c.id&&q.f===k.f)){S.cards.push({id:uid(),cid:c.id,f:String(k.f),b:String(k.b),box:0,due:Date.now()});cnt.nc++}});
      });
      c.lectures.sort((a,b)=>(a.order||999)-(b.order||999));
}
async function importPacks(files){
  const space=curSpace(),here=tab==='course'?null:cur[space];const cnt={nl:0,nc:0};
  try{
    for(const f of files){
      const o=JSON.parse(await f.text());
      if(!o||o.format!=='besminut-pack'||!o.course||!Array.isArray(o.lectures))throw new Error(f.name+': бұл сабақ пакеті емес');
      mergePack(o,space,here,cnt);
    }
    save();render();flash('#pmsg',`Қосылды: ${cnt.nl} сабақ, ${cnt.nc} карточка`);
  }catch(e){render();const m=$('#pmsg');if(m)m.textContent='Қате: '+(e&&e.message||e)}
}
/* auto-sync lesson packs published next to the app (GitHub Pages) */
async function syncPacks(){
  if(location.protocol!=='https:'||/claude/.test(location.hostname))return;
  try{
    const r=await fetch('courses/index.json',{cache:'no-store'});if(!r.ok)return;const idx=await r.json();
    S.synced=S.synced||{};const cnt={nl:0,nc:0};let changed=false;
    for(const it of idx.packs||[]){
      if(S.synced[it.path]===it.v)continue;
      const pr=await fetch(it.path,{cache:'no-store'});if(!pr.ok)continue;const o=await pr.json();
      if(!o||o.format!=='besminut-pack'||!o.course||!Array.isArray(o.lectures))continue;
      const sp=o.course.space==='skills'?'skills':'courses';mergePack(o,sp,null,cnt);S.synced[it.path]=it.v;changed=true;
    }
    if(changed){save();if(!noteOpen&&ov.hidden)render();toast(cnt.nl?`Жаңа сабақтар келді: ${cnt.nl}`:'Сабақтар жаңартылды')}
  }catch(e){}
}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3500)}


/* ---------- long-press menu ---------- */
let lpTimer=null,lpFired=false,lpStart=null;
document.addEventListener('pointerdown',e=>{
  if(e.target.closest('.grip,.more,.pop,.sheet'))return;const row=e.target.closest('.item[data-key]');if(!row)return;
  lpStart={x:e.clientX,y:e.clientY};lpFired=false;clearTimeout(lpTimer);
  lpTimer=setTimeout(()=>{lpFired=true;if(navigator.vibrate)try{navigator.vibrate(10)}catch(_){};openPop(row,itemMenu(row.dataset.key),{left:lpStart.x-20,right:lpStart.x,top:lpStart.y,bottom:lpStart.y})},480);
});
document.addEventListener('pointermove',e=>{if(lpStart&&Math.hypot(e.clientX-lpStart.x,e.clientY-lpStart.y)>10)clearTimeout(lpTimer)});
['pointerup','pointercancel'].forEach(t=>document.addEventListener(t,()=>{clearTimeout(lpTimer);lpStart=null}));
document.addEventListener('contextmenu',e=>{const row=e.target.closest('.item[data-key]');if(!row)return;e.preventDefault();lpFired=true;openPop(row,itemMenu(row.dataset.key),{left:e.clientX,right:e.clientX,top:e.clientY,bottom:e.clientY})});

/* ---------- drag to reorder ---------- */
document.addEventListener('pointerdown',e=>{
  const g=e.target.closest('.grip');if(!g)return;const row=g.closest('.item'),list=row&&row.parentElement;if(!list||!list.classList.contains('sortable'))return;
  e.preventDefault();closePop();
  const rows=[...list.children].filter(r=>r.classList.contains('item')),idx=rows.indexOf(row),startY=e.clientY,rect=row.getBoundingClientRect(),h=rect.height;
  const mids=rows.map(r=>{const b=r.getBoundingClientRect();return b.top+b.height/2});let ni=idx;
  row.classList.add('dragging');list.classList.add('is-sorting');try{g.setPointerCapture(e.pointerId)}catch(_){}
  const mv=ev=>{const dy=ev.clientY-startY;row.style.transform=`translateY(${dy}px)`;const y=rect.top+h/2+dy;ni=mids.filter((m,i)=>i!==idx&&m<y).length;
    rows.forEach((r,i)=>{if(r===row)return;let s=0;if(idx<ni&&i>idx&&i<=ni)s=-h;if(idx>ni&&i<idx&&i>=ni)s=h;r.style.transform=s?`translateY(${s}px)`:''})};
  const up=()=>{g.removeEventListener('pointermove',mv);g.removeEventListener('pointerup',up);g.removeEventListener('pointercancel',up);
    const keys=rows.map(r=>r.dataset.key);const [k]=keys.splice(idx,1);keys.splice(ni,0,k);
    if(keys[0][0]==='l'){const c=course(curCourse);c.lectures=keys.map(x=>c.lectures.find(l=>'l:'+l.id===x)).filter(Boolean)}
    else keys.forEach((x,i)=>{const o=objOf(x);if(o)o.ord=i});
    save();render()};
  g.addEventListener('pointermove',mv);g.addEventListener('pointerup',up);g.addEventListener('pointercancel',up);
});

document.addEventListener('click',e=>{
  if(lpFired){lpFired=false;if(!e.target.closest('.pop')){e.preventDefault();e.stopPropagation();return}}
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;const f=ACT[b.dataset.act];if(f){e.preventDefault();f(b,b.dataset.v);if(b.closest('.pop')&&!['rm'].includes(b.dataset.act))closePop()}
},true);
document.addEventListener('submit',e=>{
  e.preventDefault();const id=e.target.id,sp=curSpace();
  if(id==='sform'){const v=$('#si').value.trim(),ctx=sheetCtx||{};if(!v){$('#si').focus();return}
    if(ctx.op==='newf'){const pid=cur[sp];S.folders.push({id:uid(),name:v,space:sp,parent:pid,ord:nextOrd(sp,pid)})}
    if(ctx.op==='newc'){const pid=cur[sp];const c={id:uid(),name:v,space:sp,folder:pid,lectures:[],ord:nextOrd(sp,pid)};S.courses.push(c);curCourse=c.id;tab='course'}
    if(ctx.op==='ren'){const o=objOf(ctx.key);if(o){if(ctx.key[0]==='l')o.title=v;else o.name=v}}
    closeSheet();save();render()}
  if(id==='emoform'){const v=$('#emoin').value.trim();const o=objOf(sheetCtx.key);if(o&&v){o.emoji=[...v].slice(0,2).join('');save()}closeSheet();render()}
  if(id==='ladd')addLecture();
  if(id==='lvcf')LV&&LV.saveCard();
});
document.addEventListener('input',e=>{
  if(e.target.id==='nq'){noteQ=e.target.value;renderNoteList()}
  if(e.target.id==='ned'){clearTimeout(noteTimer);noteTimer=setTimeout(saveNoteNow,300)}
});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='pk'&&t.files.length){importPacks([...t.files]);t.value=''}});
window.addEventListener('scroll',closePop,{passive:true});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&noteOpen)saveNoteNow()});

function getTheme(){try{return localStorage.getItem('besminut.theme')||'system'}catch(e){return 'system'}}
function applyTheme(t){const r=document.documentElement;if(t==='light'||t==='dark')r.setAttribute('data-theme',t);else r.removeAttribute('data-theme');
  const dark=t==='dark'||(t!=='light'&&matchMedia('(prefers-color-scheme: dark)').matches);let m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',dark?'#1F2326':'#F1F2EE')}
function setTheme(t){try{localStorage.setItem('besminut.theme',t)}catch(e){}applyTheme(t)}
applyTheme(getTheme());
load();save();render();syncPacks();document.addEventListener('visibilitychange',()=>{if(!document.hidden)syncPacks()});
try{if('serviceWorker' in navigator&&location.protocol==='https:'&&!/claude/.test(location.hostname))navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}
})();
